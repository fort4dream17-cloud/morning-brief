{"name":"US Daily Market Bot","on":{"schedule":[{"cron":"30 20 * * 1-5"},{"cron":"30 21 * * 1-5"}],"workflow_dispatch":{}},"jobs":{"daily-market":{"runs-on":"ubuntu-latest","timeout-minutes":45,"permissions":{"contents":"read"},"steps":[{"name":"Check New York market-close time","id":"market_time","run":"python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; import os; now=datetime.now(ZoneInfo(\"America/New_York\")); open(os.environ[\"GITHUB_OUTPUT\"],\"a\").write(\"should_run=\"+(\"true\" if now.hour==16 else \"false\")+\"\\n\")'"},{"name":"Check out repository","if":"github.event_name == 'workflow_dispatch' || steps.market_time.outputs.should_run == 'true'","uses":"actions/checkout@v4"},{"name":"Set up Python","if":"github.event_name == 'workflow_dispatch' || steps.market_time.outputs.should_run == 'true'","uses":"actions/setup-python@v5","with":{"python-version":"3.11","cache":"pip"}},{"name":"Install dependencies","if":"github.event_name == 'workflow_dispatch' || steps.market_time.outputs.should_run == 'true'","run":"pip install -r requirements.txt"},{"name":"Send Korean US market briefing with OpenAI","if":"github.event_name == 'workflow_dispatch' || steps.market_time.outputs.should_run == 'true'","env":{"TELEGRAM_TOKEN":"${{ secrets.TELEGRAM_BOT_TOKEN }}","CHAT_ID":"${{ secrets.TELEGRAM_CHAT_ID }}","FRED_API_KEY":"${{ secrets.FRED_API_KEY }}","OPENAI_API_KEY":"${{ secrets.OPENAI_API_KEY }}","OPENAI_MODEL":"gpt-5-mini"},"run":"python openai_runner.py"}]}}}
