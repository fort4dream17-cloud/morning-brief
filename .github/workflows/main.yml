{"name":"US Daily Market Bot","on":{"schedule":[{"cron":"30 20 * * 1-5"},{"cron":"30 21 * * 1-5"}],"workflow_dispatch":{}},"jobs":{"daily-market":{"runs-on":"ubuntu-latest","timeout-minutes":45,"permissions":{"contents":"read"},"steps":[{"name":"Check New York market-close time","id":"market_time","run":"python -c \"from datetime import datetime; from zoneinfo import ZoneInfo; import os; now=datetime.now(ZoneInfo('America/New_York')); open(os.environ['GITHUB_OUTPUT'],'a').write('should_run='+('true' if now.hour==16 else 'false')+'\\n')\""},{"name":"Check out repository","if":"github.event_name == 'workflow_dispatch' || steps.market_time.outputs.should_run == 'true'","uses":"actions/checkout@v4"},{"name":"Set up Python","if":"github.event_name == 'workflow_dispatch' || steps.market_time.outputs.should_run == 'true'","uses":"actions/setup-python@v5","with":{"python-version":"3.11","cache":"pip"}},{"name":"Install dependencies","if":"github.event_name == 'workflow_dispatch' || steps.market_time.outputs.should_run == 'true'","run":"pip install -r requirements.txt"},{"name":"Send US market briefing without AI API","if":"github.event_name == 'workflow_dispatch' || steps.market_time.outputs.should_run == 'true'","env":{"TELEGRAM_TOKEN":"${{ secrets.TELEGRAM_BOT_TOKEN }}","CHAT_ID":"${{ secrets.TELEGRAM_CHAT_ID }}","FRED_API_KEY":"${{ secrets.FRED_API_KEY }}"},"run":"python -c \"import openai_runner as r; r.CLIENT=1; r.bot._CLAUDE_CLIENT=1; r.openai_call=lambda *a,**k:None; r.bot._claude_call=r.openai_call; r.bot._generate_summary=lambda finviz_home,forex_bonds,market_data,finviz_news,extra_news,ts2_article,movers_block='': 'SUMMARY - VERIFIED MARKET DATA\\n'+market_data[:2500]+'\\n\\nNOTABLE MOVERS\\n'+movers_block; r.bot._generate_ideas=lambda *a,**k:''; r.main()\""}]}}}
