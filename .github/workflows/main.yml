name: US Daily Market Bot

on:
  schedule:
    # Multiple attempts improve GitHub scheduler reliability.
    # The New York time check and daily cache prevent duplicate delivery.
    # EDT candidates: 05:31/05:46/06:01 KST.
    - cron: "31,46 20 * * 1-5"
    - cron: "1 21 * * 1-5"
    # EST candidates: 06:31/06:46/07:01 KST.
    - cron: "31,46 21 * * 1-5"
    - cron: "1 22 * * 1-5"
  workflow_dispatch:

jobs:
  daily-market:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Decide scheduled run
        id: market_time
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          import os

          event_name = os.getenv("EVENT_NAME", "")
          ny_now = datetime.now(timezone.utc).astimezone(ZoneInfo("America/New_York"))
          ny_minutes = ny_now.hour * 60 + ny_now.minute
          near_market_close = (16 * 60 + 20) <= ny_minutes <= (17 * 60 + 20)
          market_weekday = ny_now.weekday() < 5
          should_run = event_name == "workflow_dispatch" or (
              near_market_close and market_weekday
          )
          print(
              f"should_run={should_run}; event={event_name}; "
              f"ny_now={ny_now:%Y-%m-%d %H:%M %Z}; "
              f"near_market_close={near_market_close}"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_run={'true' if should_run else 'false'}\n")
          PY

      - name: Check out repository
        if: steps.market_time.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Restore Telegram destination
        if: steps.market_time.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: .telegram-chat-id
          key: telegram-chat-id-v1

      - name: Resolve Telegram destination
        if: steps.market_time.outputs.should_run == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_chat.py

      - name: Build daily delivery key
        if: steps.market_time.outputs.should_run == 'true' && github.event_name == 'schedule'
        id: daily_key
        run: |
          echo "key=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"

      - name: Check whether this market day was already sent
        if: steps.market_time.outputs.should_run == 'true' && github.event_name == 'schedule'
        id: daily_cache
        uses: actions/cache@v4
        with:
          path: .daily-delivered
          key: daily-delivered-${{ steps.daily_key.outputs.key }}

      - name: Set up Python
        if: >-
          steps.market_time.outputs.should_run == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
          steps.daily_cache.outputs.cache-hit != 'true')
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: >-
          steps.market_time.outputs.should_run == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
          steps.daily_cache.outputs.cache-hit != 'true')
        run: pip install -r requirements.txt

      - name: Send Korean US market briefing with OpenAI
        if: >-
          steps.market_time.outputs.should_run == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
          steps.daily_cache.outputs.cache-hit != 'true')
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
        run: python openai_runner.py

      - name: Mark scheduled delivery complete
        if: >-
          success() && github.event_name == 'schedule' &&
          steps.market_time.outputs.should_run == 'true' &&
          steps.daily_cache.outputs.cache-hit != 'true'
        run: touch .daily-delivered
