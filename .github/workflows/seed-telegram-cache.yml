name: Seed Telegram Destination

on:
  push:
    paths:
      - ".github/workflows/seed-telegram-cache.yml"

jobs:
  seed:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Telegram destination
        id: telegram_cache
        uses: actions/cache/restore@v4
        with:
          path: .telegram-chat-id
          key: telegram-chat-id-v1

      - name: Resolve Telegram destination
        if: steps.telegram_cache.outputs.cache-hit != 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_chat.py

      - name: Save Telegram destination
        if: steps.telegram_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .telegram-chat-id
          key: telegram-chat-id-v1
